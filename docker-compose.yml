name: tickethub

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tickethub
      POSTGRES_USER: ${DB_USERNAME:-tickethub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tickethub}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d tickethub"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]

  api:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/tickethub
      DB_USERNAME: ${DB_USERNAME:-tickethub}
      DB_PASSWORD: ${DB_PASSWORD:-tickethub}
      REDIS_URL: redis://redis:6379
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      APP_CORS_ORIGIN: ${APP_CORS_ORIGIN:-http://localhost:5173}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-256-bit-secret-in-env}
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports: ["5173:80"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    profiles: [observability]
    volumes: [./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]
    depends_on: [api]

  grafana:
    image: grafana/grafana
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
